# Publishes the app to GitHub Pages on every push to main.
# Turn it on once under Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys queue; they do not cancel each other. With cancel-in-progress, a push
# made while the previous one was still publishing killed it mid-deploy — the
# Fig & Moss colours were reported as shipped and never reached the phone.
# Each push takes its turn, so "it's live" means it is.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
